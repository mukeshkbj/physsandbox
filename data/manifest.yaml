# Ground truth for each seeded dataset. Used by eval/run_eval.py.
# A case with `after` + `test` is a follow-up: the first file is analysed,
# then the result of the named test is added as new evidence.
datasets:
  - file: r_offset_1.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
  - file: r_offset_1_zero.csv
    after: r_offset_1.csv
    test: zero_current_reading
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
    status: confirmed
  - file: r_meter_zero.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: meter_zero_offset
    step1_top: thermoelectric_offset
  - file: r_meter_zero_zero.csv
    after: r_meter_zero.csv
    test: zero_current_reading
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: meter_zero_offset
    partner: true
  - file: r_offset_1_followup.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
  - file: r_clean.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: no_fault
    status: clear
  - file: inject_1.csv
    experiment: resistance_4wire
    expected: {resistance_ohm: 0.010}
    truth: thermoelectric_offset
    injection: true
  - file: scope_hum_1.csv
