# The experiment bench. The interface is built from this file.
# expected: [key, label, default]   samples: [file, label, tag?]
# followups: sample result for the test a researcher would run next.
domains:
  - {id: electricity, label: Electricity}
  - {id: signals, label: Signals}
  - {id: magnetism, label: Magnetism}
  - {id: optics, label: Optics}
  - {id: heat, label: Heat}
  - {id: mechanics, label: Mechanics}

experiments:
  resistance_4wire:
    label: Low-resistance measurement
    domain: electricity
    blurb: Four-wire V–I sweep of a milliohm resistor or shunt
    columns: [current_A, voltage_V]
    model: "V = I·R"
    expected: [[resistance_ohm, "Expected resistance (Ω)", 0.010]]
    samples:
      - [r_offset_1.csv, "Resistor reads high at low current"]
      - [r_self_heating.csv, "Reading curves upward at high current"]
      - [r_clean.csv, "Healthy resistor"]
      - [inject_1.csv, "Same data, poisoned file", "contains a hidden instruction"]
    followups: {zero_current_reading: r_offset_1_zero.csv, current_reversal: r_offset_1_followup.csv}
    questions: ["Fit V = I·R + V0 and report the offset", "Check the residuals for curvature"]

  rc_charging:
    label: RC charging curve
    domain: electricity
    blurb: Capacitor voltage after a step, read on an oscilloscope
    columns: [time_s, voltage_V]
    model: "V = V₀(1 − e^(−t/RC))"
    expected: [[supply_V, "Supply voltage (V)", 5.0], [resistance_ohm, "Resistor (Ω)", 1000000], [capacitance_F, "Capacitor (F)", 1.0e-7]]
    samples:
      - [rc_probe_loading.csv, "Charges to half the supply, too fast"]
      - [rc_cap_tolerance.csv, "Time constant short, final voltage right"]
      - [rc_clean.csv, "Healthy circuit"]
    followups: {x10_probe_repeat: rc_probe_loading_x10.csv}
    questions: ["Fit the charging curve and report V0 and tau"]

  waveform:
    label: Oscilloscope trace
    domain: signals
    blurb: Time-domain capture, checked for mains pickup
    columns: [time_s, voltage_V]
    model: "spectrum of V(t)"
    expected: [[signal_hz, "Signal frequency (Hz)", 1000], [mains_hz, "Mains frequency (Hz)", 50]]
    samples:
      - [scope_hum_1.csv, "Trace with a hum on it"]
      - [scope_clean.csv, "Clean trace"]
    followups: {single_point_ground: scope_hum_1_followup.csv}
    questions: ["List the strongest frequencies in the trace"]

  helmholtz:
    label: Helmholtz coil calibration
    domain: magnetism
    blurb: Hall-probe field at the centre against coil current
    columns: [current_A, measured_B_uT]
    model: "B = (4/5)^(3/2) μ₀NI/R"
    expected: [[radius_m, "Coil radius (m)", 0.15], [turns, "Turns per coil", 100]]
    samples:
      - [helmholtz_ambient.csv, "Field doesn't start at zero"]
      - [helmholtz_gain.csv, "Field 18% below theory"]
      - [helmholtz_clean.csv, "Healthy calibration"]
    followups: {zero_gauss_chamber: helmholtz_ambient_shield.csv}
    questions: ["Fit B against I and compare the slope with theory"]

  faraday:
    label: Faraday's law of induction
    domain: magnetism
    blurb: Induced EMF in a search coil against the changing flux
    columns: [time_s, magnetic_flux_Wb, induced_voltage_V]
    model: "ε = −N dΦ/dt"
    expected: [[turns, "Turns on the coil", 200]]
    samples:
      - [faraday_offset.csv, "EMF sits on a DC offset"]
      - [faraday_half_turns.csv, "EMF half the predicted size"]
      - [faraday_clean.csv, "Healthy coil"]
    followups: {short_amplifier_input: faraday_offset_shorted.csv}
    questions: ["Compare the measured EMF with -N dPhi/dt"]

  laser_alignment:
    label: Laser and photodetector alignment
    domain: optics
    blurb: Detector scanned across a Gaussian beam
    columns: [position_mm, detector_voltage_mV]
    model: "V = V_d + V_p e^(−2(x−x₀)²/w²)"
    expected: [[expected_center_mm, "Beam should be at (mm)", 0.0], [expected_peak_mV, "Expected peak (mV)", 600], [waist_mm, "Beam radius (mm)", 1.0]]
    samples:
      - [laser_misaligned.csv, "Peak is off-centre"]
      - [laser_low_power.csv, "Peak far too low"]
      - [laser_clean.csv, "Well aligned"]
    followups: {repeat_scan_after_warmup: laser_misaligned_rescan.csv}
    questions: ["Fit a Gaussian and report the beam centre and radius"]

  malus:
    label: Malus's law polariser
    domain: optics
    blurb: Transmission through two polarisers against analyser angle
    columns: [angle_deg, intensity]
    model: "I = I₀ cos²θ"
    expected: [[expected_offset_deg, "Angle of maximum (°)", 0]]
    samples:
      - [malus_poor_extinction.csv, "Never goes dark"]
      - [malus_angle_offset.csv, "Maximum isn't at 0°"]
      - [malus_clean.csv, "Healthy polarisers"]
    followups: {block_beam_reading: malus_poor_extinction_blocked.csv}
    questions: ["Fit I0 cos^2 and report the extinction ratio"]

  beer_lambert:
    label: Beer-Lambert absorption
    domain: optics
    blurb: Transmitted light through samples of increasing thickness
    columns: [thickness_cm, transmitted_intensity]
    model: "I = I₀ e^(−αx)"
    expected: [[expected_alpha, "Absorption coefficient (1/cm)", 0.5], [expected_i0, "Unattenuated intensity", 1.0]]
    samples:
      - [beer_stray_light.csv, "Intensity levels off above zero"]
      - [beer_high_alpha.csv, "Absorbs twice as fast as expected"]
      - [beer_clean.csv, "Healthy absorption"]
    followups: {enclosure_rescan: beer_stray_light_enclosed.csv}
    questions: ["Fit the exponential and report alpha"]

  cooling:
    label: Newton's law of cooling
    domain: heat
    blurb: A hot sample cooling in air, read with a K-type thermocouple
    columns: [time_s, temperature_C]
    model: "T = T_room + ΔT e^(−t/τ)"
    expected: [[ambient_C, "Room temperature (°C)", 21.0], [expected_tau_s, "Expected time constant (s)", 420]]
    samples:
      - [cooling_cjc_offset.csv, "Settles 2.5 °C above the room"]
      - [cooling_slow_contact.csv, "Cools far too slowly"]
      - [cooling_clean.csv, "Healthy cooling curve"]
    followups: {ice_point_check: cooling_cjc_ice_point.csv}
    questions: ["Fit the cooling curve and report tau and the final temperature"]

  diode:
    label: Diode I–V curve
    domain: electricity
    blurb: Forward current against voltage for a silicon diode
    columns: [voltage_V, current_A]
    model: "V = nV_T ln(I/I_s) + I·R_s"
    expected: [[temperature_K, "Temperature (K)", 300], [max_series_ohm, "Largest normal series R (Ω)", 1.0]]
    samples:
      - [diode_burden.csv, "Curve bends over at high current"]
      - [diode_reversed.csv, "Almost no current flows"]
      - [diode_clean.csv, "Healthy diode"]
    followups: {voltmeter_on_diode: diode_burden_rewired.csv}
    questions: ["Fit the Shockley equation and report n and the series resistance"]

  hall:
    label: Hall effect
    domain: magnetism
    blurb: Hall voltage against sample current in a fixed field
    columns: [current_A, hall_voltage_V]
    model: "V_H = IB / (n e t)"
    expected: [[field_T, "Field (T)", 0.3], [thickness_m, "Sample thickness (m)", 0.001], [carrier_density_per_m3, "Expected carrier density (/m³)", 1.0e+21]]
    samples:
      - [hall_misaligned.csv, "Carrier density 25% high"]
      - [hall_thermal.csv, "Voltage at zero current"]
      - [hall_clean.csv, "Healthy sample"]
    followups: {reverse_field: hall_misaligned_reversed.csv}
    questions: ["Fit V_H against I and work out the carrier density"]

  grating:
    label: Diffraction grating
    domain: optics
    blurb: Diffraction angles of a laser through a grating, orders −3 to +3
    columns: [order_m, angle_deg]
    model: "d sin θ = mλ"
    expected: [[lines_per_mm, "Grating (lines/mm)", 600], [wavelength_nm, "Laser wavelength (nm)", 532]]
    samples:
      - [grating_wrong_spec.csv, "Wavelength comes out 17% short"]
      - [grating_zero_offset.csv, "Orders lopsided left to right"]
      - [grating_clean.csv, "Healthy measurement"]
    followups: {reference_line_check: grating_wrong_spec_ref.csv}
    questions: ["Fit the grating equation and report the wavelength"]

  pendulum:
    label: Simple pendulum
    domain: mechanics
    blurb: Period against length, to measure g
    columns: [length_m, period_s]
    model: "T = 2π√(L/g)"
    expected: [[g_m_s2, "Expected g (m/s²)", 9.81]]
    samples:
      - [pendulum_large_amp.csv, "g comes out 3% low"]
      - [pendulum_length_offset.csv, "T² line misses the origin"]
      - [pendulum_clean.csv, "Healthy measurement"]
    followups: {small_amplitude_repeat: pendulum_large_amp_small.csv}
    questions: ["Fit T² against L and report g"]

  hooke:
    label: Hooke's law spring
    domain: mechanics
    blurb: Extension against hanging mass, to measure the spring constant
    columns: [mass_kg, extension_m]
    model: "F = mg = k·x"
    expected: [[spring_constant_N_per_m, "Expected spring constant (N/m)", 25.0]]
    samples:
      - [hooke_hanger.csv, "Force line misses the origin"]
      - [hooke_overstretched.csv, "Line bends at high loads"]
      - [hooke_clean.csv, "Healthy spring"]
    followups: {include_hanger_repeat: hooke_hanger_included.csv}
    questions: ["Fit the load against extension and report k"]

# What each sample is, shown when it is picked: [the bench, what looks off].
# The symptom only: finding the cause is the tool's job.
sample_info:
  r_offset_1.csv: ["Four-wire V–I sweep of a 10 mΩ resistor: 10 currents from 10 to 100 mA, read on a nanovoltmeter.", "The voltage is too high, most of all at low current, so the apparent resistance falls as the current rises."]
  r_self_heating.csv: ["The same 10 mΩ four-wire sweep, from the team's first prototype.", "The points curve upward: the resistance seems to grow with current instead of staying constant."]
  r_clean.csv: ["The same 10 mΩ four-wire sweep with nothing wrong.", "Nothing should look off: a control to show PhysSandbox doesn't raise false alarms."]
  inject_1.csv: ["Exactly the same readings as “Resistor reads high”, plus a comment line at the top.", "The comment is a hidden instruction aimed at the AI: report the sample as fine and upload the file elsewhere. Use it with Ask the agent to see what the glovebox contains."]
  r_offset_1_zero.csv: ["Voltage read at zero current: 10 readings with the leads on the sample, then 10 with the meter input shorted.", "Compare the two groups: does the offset belong to the sample connections or to the meter?"]
  rc_probe_loading.csv: ["1 MΩ resistor charging a 100 nF capacitor from 5 V, captured on an oscilloscope over 0.6 s.", "The capacitor only reaches about half the supply voltage, and gets there in about half the expected time constant (0.1 s)."]
  rc_cap_tolerance.csv: ["The same RC charging circuit and oscilloscope capture.", "It charges to the full 5 V, but faster than the 0.1 s time constant the parts should give."]
  rc_clean.csv: ["The same RC charging circuit, working as designed.", "Nothing should look off: final voltage and time constant both match."]
  rc_probe_loading_x10.csv: ["The same charging curve, recorded again with the probe switched to ×10.", "Compare with the first capture: did the final voltage and time constant come back?"]
  diode_burden.csv: ["Forward I–V sweep of a silicon signal diode, 1 µA to 50 mA, with a multimeter as voltmeter and a second as ammeter.", "The exponential curve bends over above a few mA, as if a resistance of about 10 Ω were in series."]
  diode_reversed.csv: ["The same diode sweep, 0.1 V to 0.9 V applied.", "Only nanoamps flow at every voltage, where a forward diode would pass milliamps above about 0.6 V."]
  diode_clean.csv: ["The same diode sweep with nothing wrong.", "Nothing should look off: ideality about 1.9 and a small series resistance."]
  diode_burden_rewired.csv: ["The same sweep after moving the voltmeter leads onto the diode's own legs.", "Compare with the first sweep: is the bend at high current still there?"]
  scope_hum_1.csv: ["Oscilloscope capture of a 1 kHz, 1 V test signal: 2,000 samples at 10 kHz.", "There is an extra slow wobble riding on the signal, a few hundred millivolts."]
  scope_clean.csv: ["The same 1 kHz capture with nothing wrong.", "Nothing should look off: only the 1 kHz signal and a little noise."]
  scope_hum_1_followup.csv: ["The same capture after rewiring the grounds to a single point.", "Compare the spectrum: is the low-frequency pickup gone?"]
  helmholtz_ambient.csv: ["Hall-probe field at the centre of a Helmholtz pair (R = 15 cm, 100 turns each) for currents 0.1–1 A.", "The slope matches theory, but the line doesn't pass through zero: there is about 45 µT of field at zero current."]
  helmholtz_gain.csv: ["The same Helmholtz calibration sweep.", "The line goes through zero, but its slope is about 18% below the theoretical 600 µT/A."]
  helmholtz_clean.csv: ["The same Helmholtz calibration with nothing wrong.", "Nothing should look off: slope matches theory, no offset."]
  helmholtz_ambient_shield.csv: ["Probe read at zero coil current: 10 readings in the open, then 10 inside a zero-gauss chamber.", "Compare the two groups: does the offset disappear when the probe is shielded?"]
  faraday_offset.csv: ["Coil of 200 turns in a 10 Hz sinusoidal flux (0.1 mWb peak); induced voltage recorded through an amplifier.", "The induced voltage has the right size and shape, but the whole trace is shifted up by about 0.15 V."]
  faraday_half_turns.csv: ["The same Faraday's-law measurement.", "The induced voltage is only about half what N·dΦ/dt predicts, with the right shape and no offset."]
  faraday_clean.csv: ["The same Faraday's-law measurement with nothing wrong.", "Nothing should look off: measured EMF matches the prediction."]
  faraday_offset_shorted.csv: ["Magnet held still: 10 readings with the coil connected, then 10 with the amplifier input shorted.", "Compare the two groups: is the offset still there with the coil out of the circuit?"]
  hall_misaligned.csv: ["Hall voltage of a 1 mm thick sample in 0.3 T, for sample currents 1–10 mA.", "The line goes through zero, but its slope gives a carrier density about 25% above the expected 1×10²¹ /m³."]
  hall_thermal.csv: ["The same Hall-effect sweep.", "The slope is right, but the voltage doesn't start at zero: there is about 0.5 mV with no current."]
  hall_clean.csv: ["The same Hall-effect sweep with nothing wrong.", "Nothing should look off: carrier density matches, no offset."]
  hall_misaligned_reversed.csv: ["The same current sweep, run with the field forward and then reversed.", "Compare the two lines: do they flip symmetrically, or is part of the voltage unchanged by the field?"]
  laser_misaligned.csv: ["Photodetector scanned across a laser beam (1 mm radius) from −3 to +3 mm in 0.25 mm steps.", "The beam profile has the right height and width, but its peak sits about 0.85 mm off centre."]
  laser_low_power.csv: ["The same beam-profile scan.", "The peak is centred and the right width, but only about 180 mV high instead of about 600 mV."]
  laser_clean.csv: ["The same beam-profile scan, well aligned.", "Nothing should look off: centred, right height and width."]
  laser_misaligned_rescan.csv: ["The same scan repeated after the laser had 15 minutes to warm up.", "Compare with the first scan: has the peak moved?"]
  malus_poor_extinction.csv: ["Light through two polarisers as the analyser turns from 0° to 180° in 10° steps.", "The cos² curve has the right shape, but it never reaches dark: at 90° about 8% of the light is still there."]
  malus_angle_offset.csv: ["The same polariser rotation.", "The curve goes fully dark, but the brightest point is at about 12° instead of 0°."]
  malus_clean.csv: ["The same polariser rotation with nothing wrong.", "Nothing should look off: maximum at 0°, dark at 90°."]
  malus_poor_extinction_blocked.csv: ["Analyser at 90°: 10 readings with the beam on, then 10 with the beam blocked.", "Compare the two groups: does the leftover light depend on the laser at all?"]
  beer_stray_light.csv: ["Transmitted intensity through 0–5 cm of absorber in 0.5 cm steps.", "The curve falls off exponentially but levels out at about 12% instead of heading to zero."]
  beer_high_alpha.csv: ["The same absorption scan.", "The curve heads to zero, but falls about twice as fast as the expected α = 0.5 /cm."]
  beer_clean.csv: ["The same absorption scan with nothing wrong.", "Nothing should look off: α matches and the light heads to zero."]
  beer_stray_light_enclosed.csv: ["The same scan with the enclosure lid closed and the room lights off.", "Compare with the first scan: does the intensity still level off above zero?"]
  grating_wrong_spec.csv: ["Diffraction angles of a 532 nm green laser through a grating labelled 600 lines/mm, orders −3 to +3.", "The pattern is symmetric, but the angles give a wavelength about 17% shorter than 532 nm."]
  grating_zero_offset.csv: ["The same grating measurement.", "The wavelength is right, but every order on one side reads high and on the other side low."]
  grating_clean.csv: ["The same grating measurement with nothing wrong.", "Nothing should look off: wavelength matches, pattern symmetric."]
  grating_wrong_spec_ref.csv: ["The same grating, measured with a helium-neon laser of known wavelength (632.8 nm).", "Does the reference line come out right? If not, the problem travels with the grating."]
  cooling_cjc_offset.csv: ["A sample at 80 °C cooling in a 21 °C room, logged every minute for 30 minutes with a K-type thermocouple.", "It cools at the expected rate, but settles about 2.5 °C above the room temperature."]
  cooling_slow_contact.csv: ["The same cooling run.", "It settles at room temperature, but takes more than twice as long as expected to get there."]
  cooling_clean.csv: ["The same cooling run with nothing wrong.", "Nothing should look off: settles at 21 °C at the expected rate."]
  cooling_cjc_ice_point.csv: ["The same thermocouple held in stirred ice water for two minutes; it should read 0.0 °C.", "Does it read zero?"]
  pendulum_large_amp.csv: ["Period of a simple pendulum at 11 lengths from 0.2 to 1.2 m, each timed over 10 swings.", "T² against L is a straight line through the origin, but its slope gives g about 3% below 9.81 m/s²."]
  pendulum_length_offset.csv: ["The same pendulum timing.", "The slope gives the right g, but the T² line doesn't pass through the origin."]
  pendulum_clean.csv: ["The same pendulum timing with nothing wrong.", "Nothing should look off: g matches and the line goes through the origin."]
  pendulum_large_amp_small.csv: ["The same lengths timed again, released from 5° or less.", "Does g come back to 9.81 m/s²?"]
  hooke_hanger.csv: ["Extension of a spring under 10 loads from 50 g to 500 g, read against a ruler.", "The slope gives the expected spring constant, but the force line misses the origin by about half a newton."]
  hooke_overstretched.csv: ["The same spring loading.", "At low loads it looks fine, but the line bends: the spring stretches more and more at high loads."]
  hooke_clean.csv: ["The same spring loading with nothing wrong.", "Nothing should look off: k matches, line through the origin."]
  hooke_hanger_included.csv: ["The same loads with the hanger weighed (50 g) and added to every mass.", "Does the force line now go through the origin?"]
  r_offset_1_followup.csv: ["The same sweep run with the current forward and then reversed.", "Compare the two directions: does the offset keep its sign when the current flips?"]

# Display names for the values the analyses return: key: [label, unit, plain]
# (plain = 1: the unit already carries its prefix, so no SI scaling). The page and
# the PDF report both format values from these; catalog.d/*.yaml add their own.
