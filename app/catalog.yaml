  resistance_fit_ohm: ["Fitted resistance", "Ω"]
  expected_resistance_ohm: ["Expected resistance", "Ω"]
  offset_V: ["Voltage offset", "V"]
  apparent_resistance_at_lowest_current_ohm: ["Apparent R at lowest current", "Ω"]
  residual_rms_V: ["Fit residual (rms)", "V"]
  offset_on_sample_V: ["Offset, leads on sample", "V"]
  offset_with_meter_shorted_V: ["Offset, meter shorted", "V"]
  sample_rate_Hz: ["Sample rate", "Hz"]
  dominant_frequency_Hz: ["Strongest frequency", "Hz"]
  signal_amplitude_V: ["Signal amplitude", "V"]
  mains_total_amplitude_V: ["Mains pickup", "V"]
  noise_floor_V: ["Noise floor", "V"]
  coil_constant_uT_per_A: ["Coil constant, fitted", "µT/A", 1]
  theoretical_constant_uT_per_A: ["Coil constant, theory", "µT/A", 1]
  field_offset_uT: ["Field at zero current", "µT", 1]
  field_in_open_uT: ["Field, probe in the open", "µT", 1]
  field_in_shield_uT: ["Field, probe in chamber", "µT", 1]
  beam_centre_mm: ["Beam centre", "mm", 1]
  peak_signal_mV: ["Peak signal", "mV", 1]
  beam_radius_mm: ["Beam radius", "mm", 1]
  dark_level_mV: ["Dark level", "mV", 1]
  measured_over_predicted: ["Measured ÷ predicted EMF", "", 1]
  dc_offset_V: ["DC offset", "V"]
  peak_predicted_emf_V: ["Peak predicted EMF", "V"]
  odd_reading_time_s: ["Time of the odd reading", "s"]
  offset_coil_connected_V: ["Offset, coil connected", "V"]
  offset_input_shorted_V: ["Offset, input shorted", "V"]
  absorption_coefficient_per_cm: ["Absorption coefficient α", "/cm", 1]
  unattenuated_intensity: ["Unattenuated intensity I₀", "", 1]
  background_light: ["Background light", "", 1]
  peak_transmission: ["Peak transmission", "", 1]
  angle_of_maximum_deg: ["Angle of maximum", "°", 1]
  light_at_extinction: ["Light at extinction", "", 1]
  reading_crossed: ["Reading, polarisers crossed", "", 1]
  reading_beam_blocked: ["Reading, beam blocked", "", 1]
  settles_at_C: ["Settles at", "°C", 1]
  room_temperature_C: ["Room temperature", "°C", 1]
  cooling_time_constant_s: ["Time constant τ", "s", 1]
  ice_point_reading_C: ["Ice-point reading", "°C", 1]
