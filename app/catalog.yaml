  g_expected_m_s2: ["g, expected", "m/s²", 1]
  length_offset_m: ["Length offset", "m", 1]
  spring_constant_N_per_m: ["Spring constant k", "N/m", 1]
  expected_spring_constant_N_per_m: ["Expected k", "N/m", 1]
