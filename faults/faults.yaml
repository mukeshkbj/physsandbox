# PhysSandbox fault library.
#
# Each fault lists the evidence it predicts. Evidence features come from
# sandbox/tools/analyze.py. A condition is scored with p_true when it holds
# and p_false when it does not (a simple naive-Bayes style likelihood).
#
# Tests list the outcome each fault predicts. The ranker picks the test with
# the highest expected information gain per minute of effort.

experiments:

  resistance_4wire:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.05}
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: slope_error_pct, op: abs_lt, value: 2, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the fitted resistance with its uncertainty.
      thermoelectric_offset:
        name: Thermoelectric (thermal EMF) offset at a contact
        prior: 0.20
        typical_size: "0.2 µV/°C (Cu–Cu) up to ~1000 µV/°C (Cu–oxidised Cu)"
        conditions:
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.05}
          - {feature: offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.05}
          - {feature: slope_error_pct, op: abs_lt, value: 2, p_true: 0.9, p_false: 0.2}
          - {feature: offset_survives_reversal, op: is, value: true, p_true: 0.99, p_false: 0.5}
          - {feature: offset_only_on_sample, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Clean the oxidised contact or use copper-to-copper clamps, let the joints settle to the same temperature, and average sweeps with the current reversed to cancel what remains.
      meter_zero_offset:
        name: Voltmeter zero offset
        prior: 0.10
        conditions:
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.05}
          - {feature: offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.05}
          - {feature: slope_error_pct, op: abs_lt, value: 2, p_true: 0.9, p_false: 0.2}
          - {feature: offset_survives_reversal, op: is, value: true, p_true: 0.99, p_false: 0.5}
          - {feature: offset_only_on_sample, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Zero the voltmeter with its input shorted (its null or REL function) before the sweep, or subtract the shorted reading from every point.
      calibration_gain_error:
        name: Calibration (gain) error in meter or current source
        prior: 0.15
        conditions:
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.05}
          - {feature: slope_error_pct, op: abs_gt, value: 2, p_true: 0.95, p_false: 0.05}
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.8, p_false: 0.1}
        fix: Measure a calibrated reference resistor, correct every reading by the ratio you find, and send the meter or current source for calibration.
      lead_resistance:
        name: Lead or contact resistance included (2-wire style error)
        prior: 0.15
        conditions:
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.05}
          - {feature: slope_error_pct, op: ">", value: 2, p_true: 0.95, p_false: 0.05}
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.8, p_false: 0.1}
        fix: Rewire so the voltage sense leads clip onto the resistor inside the current leads (true four-wire), then repeat the sweep.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat the sweep with fresh contacts and a second voltmeter, and look at the residuals point by point.
      self_heating:
        name: Sample self-heating at high current
        prior: 0.10
        typical_size: "Copper's resistance rises 0.39% per °C; a shunt run hot can warm by 10 °C or more"
        conditions:
          - {feature: curvature_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.005}
        fix: Use a lower current or short current pulses, heat-sink the sample, and fit only the low-current points.

    tests:
      low_current_repeat:
        name: Repeat the sweep at a tenth of the current, pausing at each point
        minutes: 5
        how: Lower the maximum current tenfold and wait 10 s at each step. Self-heating scales with I squared, so the curve should straighten.
        outcomes:
          self_heating: line_straight
          thermoelectric_offset: no_curve
          meter_zero_offset: no_curve
          calibration_gain_error: no_curve
          lead_resistance: no_curve
          no_fault: no_curve
      current_reversal:
        name: Reverse the current and repeat the sweep
        minutes: 5
        how: Swap the current-source leads (or set negative currents) and record V at each ±I.
        outcomes:   # fault -> predicted result
          thermoelectric_offset: offset_stays
          meter_zero_offset: offset_stays
          no_fault: no_offset
          calibration_gain_error: no_offset
          lead_resistance: no_offset
        safety: Switch the current source to zero before swapping leads.
      zero_current_reading:
        name: Read the voltmeter at zero current, leads on the sample, then shorted at the meter
        minutes: 3
        how: Set I = 0. Record V with leads on the sample, then with the meter input shorted.
        outcomes:
          thermoelectric_offset: offset_only_on_sample
          meter_zero_offset: offset_in_both
          no_fault: no_offset
          calibration_gain_error: no_offset
          lead_resistance: no_offset
      reference_resistor:
        name: Measure a calibrated reference resistor
        minutes: 10
        how: Replace the sample with a known 4-terminal reference of similar value.
        outcomes:
          calibration_gain_error: slope_wrong
          lead_resistance: slope_ok
          thermoelectric_offset: slope_ok
          meter_zero_offset: slope_ok
          no_fault: slope_ok
      check_4wire_wiring:
        name: Check that sense leads attach inside the current leads
        minutes: 5
        how: Inspect the wiring; the voltage taps must sit between the current contacts.
        outcomes:
          lead_resistance: wiring_wrong
          calibration_gain_error: wiring_ok
          thermoelectric_offset: wiring_ok
          meter_zero_offset: wiring_ok
          no_fault: wiring_ok

  waveform:
    faults:
      no_fault:
        name: No fault found
        prior: 0.35
        conditions:
          - {feature: mains_snr, op: "<", value: 10, p_true: 0.95, p_false: 0.01}
          - {feature: signal_at_expected_freq, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Nothing to fix. Record the signal frequency and amplitude.
      ground_loop:
        name: Ground loop picking up mains hum
        prior: 0.20
        typical_size: "mV to hundreds of mV at the mains frequency and its odd harmonics"
        conditions:
          - {feature: mains_snr, op: ">", value: 10, p_true: 0.95, p_false: 0.05}
          - {feature: odd_harmonics_present, op: is, value: true, p_true: 0.8, p_false: 0.3}
          - {feature: hum_gone_after_fix, op: is, value: true, p_true: 0.9, p_false: 0.1}
          - {feature: hum_dropped_after_twist, op: is, value: true, p_true: 0.2, p_false: 0.8}
        fix: Connect every instrument to one ground point (never lift a safety earth), or use a differential probe if the hum stays.
      magnetic_pickup:
        name: Magnetic (inductive) pickup from a nearby transformer or cable loop
        prior: 0.10
        conditions:
          - {feature: mains_snr, op: ">", value: 10, p_true: 0.9, p_false: 0.05}
          - {feature: odd_harmonics_present, op: is, value: true, p_true: 0.5, p_false: 0.5}
          - {feature: hum_gone_after_fix, op: is, value: true, p_true: 0.15, p_false: 0.85}
          - {feature: hum_dropped_after_twist, op: is, value: true, p_true: 0.9, p_false: 0.1}
        fix: Twist the signal leads together, shrink the loop they enclose, and move them away from transformers and mains cables.
      aliasing:
        name: Aliasing (sample rate too low for the signal)
        prior: 0.10
        conditions:
          - {feature: signal_at_expected_freq, op: is, value: false, p_true: 0.95, p_false: 0.02}
        fix: Raise the sample rate to at least ten times the highest signal frequency, or add a low-pass anti-aliasing filter before the input.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Re-record with short shielded leads and a second scope channel on the same signal, and compare the two spectra.

    tests:
      single_point_ground:
        name: Connect all instruments to one ground point and re-record
        minutes: 5
        how: Plug the scope and the source into the same outlet strip; remove any extra ground connections between them.
        outcomes:
          ground_loop: hum_gone
          magnetic_pickup: hum_stays
          no_fault: no_hum
          aliasing: no_hum
        safety: Never lift or remove a safety (protective) earth. Change signal grounding only.
      twist_and_move_leads:
        name: Twist the signal leads and move them away from transformers
        minutes: 5
        how: Shorten and twist the cable pair; move it at least 30 cm from mains equipment.
        outcomes:
          magnetic_pickup: hum_drops
          ground_loop: hum_same
          no_fault: no_hum
          aliasing: no_hum
      raise_sample_rate:
        name: Re-record at a higher sample rate
        minutes: 2
        how: Increase the sample rate at least 10x and compare the dominant frequency.
        outcomes:
          aliasing: frequency_changes
          ground_loop: frequency_same
          magnetic_pickup: frequency_same
          no_fault: frequency_same

  helmholtz:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: gain_error_pct, op: abs_lt, value: 3, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the fitted coil constant with its uncertainty.
      ambient_field:
        name: Earth's field or nearby steel adding to the coil field
        prior: 0.22
        typical_size: "Earth's field is 25–65 µT; a steel bench or laptop can add tens of µT"
        conditions:
          - {feature: offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: gain_error_pct, op: abs_lt, value: 3, p_true: 0.9, p_false: 0.2}
          - {feature: offset_gone_in_shield, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Subtract the zero-current reading taken at the same probe position from every point, and move steel and laptops away from the coils.
      probe_zero_offset:
        name: Hall probe zero offset (probe not zeroed)
        prior: 0.12
        typical_size: "Uncompensated Hall sensors drift by several µT to tens of µT"
        conditions:
          - {feature: offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: gain_error_pct, op: abs_lt, value: 3, p_true: 0.9, p_false: 0.2}
          - {feature: offset_gone_in_shield, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Zero the Hall probe inside a zero-gauss chamber before the run, or subtract its zero-current reading from every point.
      probe_gain_error:
        name: Hall probe gain (sensitivity) calibration error
        prior: 0.15
        conditions:
          - {feature: gain_error_pct, op: abs_gt, value: 3, p_true: 0.95, p_false: 0.02}
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.85, p_false: 0.2}
        fix: Calibrate the probe against a reference magnetometer and scale every reading by the ratio, or swap in a calibrated probe.
      coil_geometry:
        name: Coil spacing or radius not at the Helmholtz condition
        prior: 0.12
        typical_size: "Spacing off by 10% of R changes the centre field by a few per cent"
        conditions:
          - {feature: gain_error_pct, op: abs_gt, value: 3, p_true: 0.9, p_false: 0.02}
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.85, p_false: 0.2}
        fix: Set the coil spacing equal to the coil radius, measured between the centres of the windings, and repeat the sweep.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat the sweep with a second Hall probe, checking its zero before and after, and compare point by point.
    tests:
      zero_gauss_chamber:
        name: Read the probe at zero current, in the open and inside a zero-gauss chamber
        minutes: 3
        how: Switch the coil current off. Record the field with the probe at the coil centre, then with the probe inside a mu-metal zero-gauss chamber.
        outcomes:
          ambient_field: offset_gone
          probe_zero_offset: offset_stays
          no_fault: no_offset
          probe_gain_error: no_offset
          coil_geometry: no_offset
      reference_magnetometer:
        name: Compare the probe with a calibrated reference magnetometer
        minutes: 10
        how: Put a calibrated fluxgate or reference probe at the coil centre and read both at the same currents.
        outcomes:
          probe_gain_error: readings_differ
          coil_geometry: readings_agree
          ambient_field: readings_agree
          probe_zero_offset: readings_differ
          no_fault: readings_agree
      measure_coil_spacing:
        name: Measure the coil spacing and radius
        minutes: 5
        how: The coils should be one radius apart (R = 0.15 m means 0.15 m between coil planes).
        outcomes:
          coil_geometry: spacing_wrong
          probe_gain_error: spacing_ok
          ambient_field: spacing_ok
          probe_zero_offset: spacing_ok
          no_fault: spacing_ok
        safety: Switch the coil current off before handling the coils; they can be hot at high current.

  laser_alignment:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: centre_offset_mm, op: abs_lt, value: 0.15, p_true: 0.95, p_false: 0.01}
          - {feature: peak_ratio, op: ">", value: 0.85, p_true: 0.95, p_false: 0.02}
          - {feature: flat_top, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Nothing to fix. Record the beam centre and radius.
      misalignment:
        name: Detector or beam steering misaligned
        prior: 0.22
        conditions:
          - {feature: centre_offset_mm, op: abs_gt, value: 0.15, p_true: 0.95, p_false: 0.02}
          - {feature: peak_ratio, op: ">", value: 0.85, p_true: 0.85, p_false: 0.3}
          - {feature: centre_stable, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Re-centre the beam on the detector with the steering mirrors, at low power and with eyewear on, then rescan.
      pointing_drift:
        name: Laser pointing drift during warm-up
        prior: 0.12
        typical_size: "Diode and HeNe lasers can drift tens of µrad in the first 15–30 min"
        conditions:
          - {feature: centre_offset_mm, op: abs_gt, value: 0.15, p_true: 0.9, p_false: 0.02}
          - {feature: peak_ratio, op: ">", value: 0.85, p_true: 0.85, p_false: 0.3}
          - {feature: centre_stable, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Let the laser warm up for 15 to 30 minutes before scanning, and recheck the beam centre at the end of the run.
      low_power:
        name: Low laser power or a dirty optic in the path
        prior: 0.14
        conditions:
          - {feature: peak_ratio, op: "<", value: 0.85, p_true: 0.95, p_false: 0.02}
          - {feature: centre_offset_mm, op: abs_lt, value: 0.15, p_true: 0.9, p_false: 0.2}
        fix: Clean or replace the dirty optic and check the output on a power meter; if the laser itself is low, report it to whoever looks after it.
      detector_saturation:
        name: Photodetector saturating at the beam centre
        prior: 0.08
        conditions:
          - {feature: flat_top, op: is, value: true, p_true: 0.95, p_false: 0.03}
        fix: Add a neutral-density filter or lower the detector gain so the peak sits well below the detector's maximum, then rescan.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Re-centre the beam and detector, rescan slowly, and look at the residuals around the peak.
    tests:
      repeat_scan_after_warmup:
        name: Repeat the scan after the laser has warmed up for 15 minutes
        minutes: 5
        how: Leave the laser on for 15 minutes, then scan the detector across the beam again with the same steps.
        outcomes:
          misalignment: centre_same
          pointing_drift: centre_moves
          low_power: centre_same
          no_fault: centre_same
          detector_saturation: centre_same
        safety: Keep beam paths below eye level and wear the eyewear your laser safety officer specifies.
      power_meter_check:
        name: Measure the beam power with an optical power meter
        minutes: 5
        how: Put a power meter right after the laser, then just before the detector, and compare with the laser's rated power.
        outcomes:
          low_power: power_low
          misalignment: power_ok
          pointing_drift: power_ok
          no_fault: power_ok
          detector_saturation: power_ok
      nd_filter_rescan:
        name: Add a neutral-density filter and rescan
        minutes: 5
        how: Put an ND1 filter in front of the detector; a saturated profile becomes Gaussian again.
        outcomes:
          detector_saturation: shape_restored
          low_power: shape_same
          misalignment: shape_same
          pointing_drift: shape_same
          no_fault: shape_same

  faraday:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: offset_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: gain_ratio, op: abs_dev1_lt, value: 0.05, p_true: 0.95, p_false: 0.01}
          - {feature: outlier_sigma, op: "<", value: 6, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the ratio of measured to predicted EMF.
      single_reading_glitch:
        name: One reading far off the rest (a loose contact or an amplifier spike)
        prior: 0.08
        typical_size: "One point many times the scatter away from the line; the rest agree with the prediction"
        conditions:
          - {feature: outlier_sigma, op: ">", value: 6, p_true: 0.95, p_false: 0.01}
        fix: Re-seat the coil leads and the amplifier input and repeat the run. If the spike comes back at the same moment, look for something switching on then (a relay, a motor, a lamp) and screen or move it.
      amplifier_offset:
        name: Amplifier input offset voltage
        prior: 0.18
        typical_size: "General-purpose op-amps: 1–10 mV, multiplied by the amplifier gain"
        conditions:
          - {feature: offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: gain_ratio, op: abs_dev1_lt, value: 0.05, p_true: 0.9, p_false: 0.2}
          - {feature: offset_with_input_shorted, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Null the amplifier offset with its trim while the input is shorted, or subtract the shorted-input reading from the trace.
      ground_offset:
        name: Ground potential difference between coil circuit and recorder
        prior: 0.14
        conditions:
          - {feature: offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: gain_ratio, op: abs_dev1_lt, value: 0.05, p_true: 0.9, p_false: 0.2}
          - {feature: offset_with_input_shorted, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Connect the coil circuit and the recorder to one common ground point, then re-record.
      turns_mismatch:
        name: Coil has fewer turns than specified, or a shorted winding
        prior: 0.14
        conditions:
          - {feature: gain_ratio, op: abs_dev1_gt, value: 0.05, p_true: 0.95, p_false: 0.02}
          - {feature: polarity_reversed, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Find the real number of turns (count them or infer it from the inductance) and use it in the prediction, or replace a coil with a shorted winding.
      flux_sensor_error:
        name: Flux sensor calibration error
        prior: 0.10
        conditions:
          - {feature: gain_ratio, op: abs_dev1_gt, value: 0.05, p_true: 0.9, p_false: 0.02}
          - {feature: polarity_reversed, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Recalibrate the flux sensor against a known field and recompute the predicted EMF.
      polarity_reversed:
        name: Coil leads connected the wrong way round
        prior: 0.08
        conditions:
          - {feature: polarity_reversed, op: is, value: true, p_true: 0.95, p_false: 0.01}
        fix: Swap the coil leads at the amplifier input and re-record.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Re-record with the magnet moving at a steady speed and check the coil, amplifier and recorder one at a time.
    tests:
      short_amplifier_input:
        name: Hold the magnet still, then short the amplifier input
        minutes: 3
        how: With no changing flux, record the output with the coil connected, then with the amplifier input shorted to its own ground.
        outcomes:
          amplifier_offset: offset_stays
          ground_offset: offset_gone
          no_fault: no_offset
          single_reading_glitch: no_offset
          turns_mismatch: no_offset
          flux_sensor_error: no_offset
          polarity_reversed: no_offset
      measure_coil_inductance:
        name: Measure the coil inductance with an LCR meter
        minutes: 5
        how: Inductance scales with N squared; half the turns gives a quarter of the expected inductance.
        outcomes:
          turns_mismatch: inductance_low
          flux_sensor_error: inductance_ok
          amplifier_offset: inductance_ok
          ground_offset: inductance_ok
          no_fault: inductance_ok
          single_reading_glitch: inductance_ok
          polarity_reversed: inductance_ok
      swap_coil_leads:
        name: Swap the coil leads and repeat
        minutes: 2
        how: Reverse the two coil connections at the amplifier input and record one cycle.
        outcomes:
          polarity_reversed: sign_fixed
          turns_mismatch: no_change
          flux_sensor_error: no_change
          amplifier_offset: no_change
          ground_offset: no_change
          no_fault: no_change
          single_reading_glitch: no_change

  beer_lambert:
    # The fitted absorption coefficient scatters by about 1.4% (11 thicknesses at 0.4%
    # noise, background fitted too), so "as expected" is within 6% (about 4 sigma)
    # and an absorption fault needs more than 7% (5 sigma).
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: background_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: alpha_error_pct, op: abs_lt, value: 6, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the absorption coefficient with its uncertainty.
      stray_light:
        name: Room light leaking into the detector
        prior: 0.22
        conditions:
          - {feature: background_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: alpha_error_pct, op: abs_lt, value: 6, p_true: 0.85, p_false: 0.3}
          - {feature: background_gone_enclosed, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Close the enclosure lid, switch off the room lights or shroud the detector, and rescan.
      detector_dark_offset:
        name: Detector dark-current or amplifier offset
        prior: 0.14
        conditions:
          - {feature: background_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: alpha_error_pct, op: abs_lt, value: 6, p_true: 0.85, p_false: 0.3}
          - {feature: background_gone_enclosed, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Read the detector with the beam blocked and subtract that dark level from every point before fitting.
      concentration_error:
        name: Sample concentration higher than labelled
        prior: 0.14
        conditions:
          - {feature: alpha_error_pct, op: abs_gt, value: 7, p_true: 0.95, p_false: 0.02}
          - {feature: background_sigma, op: "<", value: 4, p_true: 0.85, p_false: 0.3}
        fix: Remake the solution by weighing the solute, or check it against a standard, and refit with the true concentration.
      path_length_error:
        name: Cuvette path length different from assumed
        prior: 0.10
        conditions:
          - {feature: alpha_error_pct, op: abs_gt, value: 7, p_true: 0.9, p_false: 0.02}
          - {feature: background_sigma, op: "<", value: 4, p_true: 0.85, p_false: 0.3}
        fix: Measure the cuvette or slab thickness with calipers and refit with the measured path length.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Rescan with a fresh sample and a reference absorbance standard, and compare the two.
    tests:
      enclosure_rescan:
        name: Repeat the scan with the room lights off and the lid closed
        minutes: 5
        how: Close the sample-compartment lid, switch off the room lights, and repeat the same thicknesses.
        outcomes:
          stray_light: background_gone
          detector_dark_offset: background_stays
          no_fault: no_background
          concentration_error: no_background
          path_length_error: no_background
      measure_path_length:
        name: Measure the cuvette or slab thickness with calipers
        minutes: 3
        how: Check each sample's optical path length against the value used in the analysis.
        outcomes:
          path_length_error: length_wrong
          concentration_error: length_ok
          stray_light: length_ok
          detector_dark_offset: length_ok
          no_fault: length_ok
      reference_standard:
        name: Measure a reference absorbance standard
        minutes: 10
        how: A certified neutral-density or holmium filter has a known absorbance; it checks the instrument, not the sample.
        outcomes:
          concentration_error: standard_ok
          path_length_error: standard_ok
          detector_dark_offset: standard_off
          stray_light: standard_off
          no_fault: standard_ok

  malus:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: extinction_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: angle_offset_deg, op: abs_lt, value: 2, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record I₀ and the angle of maximum transmission.
      room_light:
        name: Room light reaching the detector
        prior: 0.20
        conditions:
          - {feature: extinction_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: angle_offset_deg, op: abs_lt, value: 2, p_true: 0.85, p_false: 0.3}
          - {feature: light_with_beam_blocked, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Shield the detector from room light (lights off or a tube over the detector), or subtract the beam-blocked reading.
      leaky_polariser:
        name: Worn or low-extinction polariser
        prior: 0.14
        typical_size: "Sheet polarisers: 100:1 to 1000:1; a worn one can drop below 20:1"
        conditions:
          - {feature: extinction_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: angle_offset_deg, op: abs_lt, value: 2, p_true: 0.85, p_false: 0.3}
          - {feature: light_with_beam_blocked, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Replace the worn polariser with one of known extinction ratio and rescan.
      analyser_zero_offset:
        name: Analyser scale not zeroed to the polariser axis
        prior: 0.18
        conditions:
          - {feature: angle_offset_deg, op: abs_gt, value: 2, p_true: 0.95, p_false: 0.02}
          - {feature: extinction_sigma, op: "<", value: 4, p_true: 0.85, p_false: 0.3}
        fix: Find the transmission minimum by hand, re-zero the analyser scale 90° from it, and refit.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Rescan with fresh polarisers and the detector shielded, and compare the two scans.
    tests:
      block_beam_reading:
        name: Read the detector at the crossed position, then with the laser beam blocked
        minutes: 2
        how: Set the analyser to the minimum, record the reading, then block the laser before the first polariser and record again.
        outcomes:
          room_light: light_stays
          leaky_polariser: light_gone
          no_fault: no_light
          analyser_zero_offset: no_light
        safety: Block the beam with a beam block or card, never with your hand.
      swap_polariser:
        name: Swap in a new polariser and rescan
        minutes: 5
        how: Replace the analyser with a fresh sheet polariser and scan 0–180° again.
        outcomes:
          leaky_polariser: extinction_better
          room_light: extinction_same
          no_fault: extinction_same
          analyser_zero_offset: extinction_same
      find_minimum_by_hand:
        name: Find the transmission minimum by hand and read the scale
        minutes: 2
        how: Rotate the analyser slowly to the darkest point; it should read 90° if the scale is zeroed.
        outcomes:
          analyser_zero_offset: minimum_off_90
          room_light: minimum_at_90
          leaky_polariser: minimum_at_90
          no_fault: minimum_at_90

  cooling:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: asymptote_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: tau_ratio, op: abs_dev1_lt, value: 0.3, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the cooling time constant with its uncertainty.
      cjc_offset:
        name: Thermocouple cold-junction compensation error
        prior: 0.20
        typical_size: "A cold junction 2–3 °C warmer than the meter assumes shifts every reading by that much"
        conditions:
          - {feature: asymptote_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: tau_ratio, op: abs_dev1_lt, value: 0.3, p_true: 0.9, p_false: 0.2}
          - {feature: offset_at_ice_point, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Check the thermocouple in ice water and subtract that offset from every reading, and keep the meter's cold junction away from warm air.
      room_not_at_assumed:
        name: The surroundings aren't at the room temperature you assumed
        prior: 0.16
        conditions:
          - {feature: asymptote_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: tau_ratio, op: abs_dev1_lt, value: 0.3, p_true: 0.9, p_false: 0.2}
          - {feature: offset_at_ice_point, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Measure the air temperature beside the sample with a second thermometer and use it as the room temperature in the fit.
      poor_thermal_contact:
        name: Poor thermal contact between thermocouple and sample
        prior: 0.14
        conditions:
          - {feature: tau_ratio, op: abs_dev1_gt, value: 0.3, p_true: 0.95, p_false: 0.05}
          - {feature: asymptote_sigma, op: "<", value: 4, p_true: 0.85, p_false: 0.3}
        fix: Tape the junction to the sample with a dab of thermal paste and repeat the run.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat with a second thermocouple on the sample and compare the two cooling curves.
    tests:
      ice_point_check:
        name: Put the thermocouple in an ice-water bath for two minutes
        minutes: 3
        how: Crushed ice topped up with water, stirred, reads 0.0 °C. Record the meter for two minutes.
        outcomes:
          cjc_offset: reads_offset
          room_not_at_assumed: reads_zero
          no_fault: reads_zero
          poor_thermal_contact: reads_zero
      measure_room_temperature:
        name: Measure the air temperature next to the sample with a second thermometer
        minutes: 5
        how: Place a calibrated thermometer where the sample cools, away from vents and windows.
        outcomes:
          room_not_at_assumed: room_differs
          cjc_offset: room_as_assumed
          no_fault: room_as_assumed
          poor_thermal_contact: room_as_assumed
      thermal_paste_repeat:
        name: Repeat with thermal paste and the junction taped to the sample
        minutes: 30
        how: Bond the thermocouple bead to the sample with thermal paste and Kapton tape, then repeat the cooling run.
        outcomes:
          poor_thermal_contact: faster_response
          cjc_offset: same_response
          room_not_at_assumed: same_response
          no_fault: same_response
        safety: Let the sample cool below 50 °C before handling it.

  rc_charging:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: final_ratio, op: abs_dev1_lt, value: 0.05, p_true: 0.95, p_false: 0.01}
          - {feature: tau_ratio, op: abs_dev1_lt, value: 0.15, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the time constant with its uncertainty.
      probe_loading:
        name: Oscilloscope probe loading the circuit (x1 probe, 1 MΩ)
        prior: 0.18
        typical_size: "A x1 probe adds 1 MΩ across the capacitor; with a 1 MΩ resistor that halves both V and τ"
        conditions:
          - {feature: final_ratio, op: "<", value: 0.95, p_true: 0.95, p_false: 0.02}
          - {feature: tau_ratio, op: "<", value: 0.85, p_true: 0.9, p_false: 0.1}
          - {feature: loading_reduced_with_x10, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Switch the probe to ×10 (10 MΩ) or buffer the capacitor voltage, then repeat the measurement.
      capacitor_leakage:
        name: Leaky capacitor
        prior: 0.12
        conditions:
          - {feature: final_ratio, op: "<", value: 0.95, p_true: 0.95, p_false: 0.02}
          - {feature: tau_ratio, op: "<", value: 0.85, p_true: 0.9, p_false: 0.1}
          - {feature: loading_reduced_with_x10, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Replace the leaky capacitor (a film capacitor leaks far less than an electrolytic) and repeat.
      capacitor_tolerance:
        name: Capacitor value outside its tolerance
        prior: 0.18
        typical_size: "Electrolytics are often ±20%; ceramics can lose half their value with bias"
        conditions:
          - {feature: tau_ratio, op: abs_dev1_gt, value: 0.15, p_true: 0.95, p_false: 0.02}
          - {feature: final_ratio, op: abs_dev1_lt, value: 0.05, p_true: 0.9, p_false: 0.02}
        fix: Measure the capacitor on an LCR meter and use the measured value in the prediction, or fit a tighter-tolerance part.
      supply_low:
        name: Supply voltage lower than set
        prior: 0.10
        conditions:
          - {feature: final_ratio, op: "<", value: 0.95, p_true: 0.95, p_false: 0.02}
          - {feature: tau_ratio, op: abs_dev1_lt, value: 0.15, p_true: 0.9, p_false: 0.05}
        fix: Set the supply with a multimeter at the circuit rather than by the supply's dial, then repeat.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat with a resistor and capacitor measured on an LCR meter and a ×10 probe, and compare.
    tests:
      x10_probe_repeat:
        name: Repeat the measurement with a x10 (10 MΩ) probe
        minutes: 2
        how: Switch the probe and the scope channel to x10 and record the same charging curve.
        outcomes:
          probe_loading: loading_much_less
          capacitor_leakage: no_change
          capacitor_tolerance: no_change
          supply_low: no_change
          no_fault: no_change
      lcr_meter_check:
        name: Measure the capacitor with an LCR meter
        minutes: 3
        how: Take the capacitor out of circuit and measure its capacitance and leakage (or dissipation factor).
        outcomes:
          capacitor_tolerance: value_off
          capacitor_leakage: leaky
          probe_loading: value_ok
          supply_low: value_ok
          no_fault: value_ok
      measure_supply:
        name: Measure the supply voltage with a multimeter
        minutes: 1
        how: Read the supply at the circuit, under load.
        outcomes:
          supply_low: supply_low
          probe_loading: supply_ok
          capacitor_leakage: supply_ok
          capacitor_tolerance: supply_ok
          no_fault: supply_ok

  pendulum:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: g_error_pct, op: abs_lt, value: 1.5, p_true: 0.95, p_false: 0.01}
          - {feature: length_offset_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record g with its uncertainty.
      large_amplitude:
        name: Too large a release angle
        prior: 0.18
        typical_size: "From 30° every period is about 1.7% long, so g comes out about 3% low"
        conditions:
          - {feature: g_error_pct, op: "<", value: -1.5, p_true: 0.95, p_false: 0.03}
          - {feature: length_offset_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: g_fixed_at_small_amplitude, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Release from 5° or less, or apply the finite-amplitude correction, and retime.
      timer_scale:
        name: Timer running fast or slow
        prior: 0.15
        conditions:
          - {feature: g_error_pct, op: abs_gt, value: 1.5, p_true: 0.95, p_false: 0.03}
          - {feature: length_offset_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: g_fixed_at_small_amplitude, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Check the timer against a reference clock and correct every period by the ratio, or time with a light gate.
      length_to_wrong_point:
        name: Length measured to the top of the bob, not its centre
        prior: 0.20
        typical_size: "A 2 cm bob radius shows up as a 2 cm intercept on the T² against L plot"
        conditions:
          - {feature: length_offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: g_error_pct, op: abs_lt, value: 1.5, p_true: 0.9, p_false: 0.1}
        fix: Measure the length to the centre of the bob, or take g from the slope of T² against L, which ignores the offset.
      miscounted_swings:
        name: Miscounted swings
        prior: 0.07
        conditions:
          - {feature: g_error_pct, op: abs_gt, value: 8, p_true: 0.95, p_false: 0.01}
        fix: Time 20 swings with a second person counting aloud, or use a light gate, and retime the odd lengths.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Retime each length three times from a small release angle and look at the spread.
    tests:
      small_amplitude_repeat:
        name: Repeat three lengths released from 5° or less
        minutes: 4
        how: Pull the bob aside by no more than a tenth of the string length and time 10 swings at three lengths.
        outcomes:
          large_amplitude: g_matches
          timer_scale: g_still_off
          length_to_wrong_point: g_matches
          no_fault: g_matches
          miscounted_swings: g_still_off
      timer_check:
        name: Check the timer against a phone clock over five minutes
        minutes: 6
        how: Start both together, stop both after five minutes and compare.
        outcomes:
          timer_scale: timer_off
          large_amplitude: timer_ok
          length_to_wrong_point: timer_ok
          no_fault: timer_ok
          miscounted_swings: timer_ok
      measure_bob:
        name: Measure the bob's diameter with callipers
        minutes: 2
        how: Add the bob's radius to every length, then refit.
        outcomes:
          length_to_wrong_point: offset_explained
          large_amplitude: offset_not_present
          timer_scale: offset_not_present
          no_fault: offset_not_present
          miscounted_swings: offset_not_present

  hooke:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: k_error_pct, op: abs_lt, value: 5, p_true: 0.95, p_false: 0.01}
          - {feature: zero_force_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the spring constant with its uncertainty.
      hanger_mass_omitted:
        name: Hanger's mass left out of the loads
        prior: 0.20
        typical_size: "A 50 g hanger shows up as about −0.49 N of force at zero extension"
        conditions:
          - {feature: zero_force_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: offset_gone_with_hanger, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Weigh the hanger, add its mass to every load, and refit.
      ruler_zero_offset:
        name: Ruler zero read in the wrong place
        prior: 0.18
        conditions:
          - {feature: zero_force_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.03}
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: offset_gone_with_hanger, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Read the pointer with only the hanger attached and measure every extension from that point.
      past_elastic_limit:
        name: Spring loaded past its elastic limit
        prior: 0.12
        conditions:
          - {feature: curvature_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.01}
        fix: Replace the overstretched spring and keep loads within the linear range of the new one.
      wrong_spring:
        name: A spring with a different constant than expected
        prior: 0.10
        conditions:
          - {feature: k_error_pct, op: abs_gt, value: 10, p_true: 0.95, p_false: 0.02}
          - {feature: zero_force_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: curvature_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.1}
        fix: Check the spring's label or part number and use the right expected k, or swap in the intended spring.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Load and unload a fresh spring, reading the pointer both ways, and compare the two runs.
    tests:
      include_hanger_repeat:
        name: Weigh the hanger and add its mass to every load
        minutes: 2
        how: Put the empty hanger on a balance, add its mass to each load and refit.
        outcomes:
          hanger_mass_omitted: offset_gone
          ruler_zero_offset: offset_stays
          no_fault: offset_gone
          past_elastic_limit: curve_remains
          wrong_spring: offset_gone
      rezero_with_hanger:
        name: Read the pointer with only the hanger attached and call that zero
        minutes: 3
        how: Remove all masses, let the hanger settle and read the pointer at eye level.
        outcomes:
          ruler_zero_offset: zero_was_misread
          hanger_mass_omitted: zero_ok
          no_fault: zero_ok
          past_elastic_limit: zero_ok
          wrong_spring: zero_ok
      unload_check:
        name: Unload the spring and check it returns to its original length
        minutes: 2
        how: Remove every mass and read the pointer again.
        outcomes:
          past_elastic_limit: stays_stretched
          hanger_mass_omitted: returns
          ruler_zero_offset: returns
          no_fault: returns
          wrong_spring: returns

  diode:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: rs_excess_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
          - {feature: no_forward_current, op: is, value: false, p_true: 0.99, p_false: 0.01}
        fix: Nothing to fix. Record the ideality factor and series resistance.
      meter_burden:
        name: Voltmeter across diode and ammeter (ammeter burden voltage)
        prior: 0.20
        typical_size: "A 10 Ω ammeter burden adds 0.5 V at 50 mA, which looks like series resistance"
        conditions:
          - {feature: rs_excess_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: droop_gone_after_rewire, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Move the voltmeter leads onto the diode's own legs so the ammeter's voltage drop is left out, then re-sweep.
      bulk_series_resistance:
        name: High series resistance in the diode itself (damaged or wrong part)
        prior: 0.15
        conditions:
          - {feature: rs_excess_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: droop_gone_after_rewire, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Replace the diode with a known-good part of the same type and repeat the sweep.
      reversed_diode:
        name: Diode connected the wrong way round
        prior: 0.10
        conditions:
          - {feature: no_forward_current, op: is, value: true, p_true: 0.98, p_false: 0.001}
        fix: Turn the diode round so its cathode band faces the negative side, and repeat.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat with a known-good diode and the voltmeter directly across it, and compare the two curves.
    tests:
      voltmeter_on_diode:
        name: Move the voltmeter leads onto the diode's own legs
        minutes: 2
        how: Connect the voltmeter directly across the diode, with the ammeter outside that loop, and repeat.
        outcomes:
          meter_burden: droop_gone
          bulk_series_resistance: droop_stays
          no_fault: droop_gone
          reversed_diode: no_current
      swap_known_good_diode:
        name: Repeat with a known-good diode of the same type
        minutes: 6
        how: Swap in a diode from a fresh pack and repeat the sweep.
        outcomes:
          bulk_series_resistance: droop_gone
          meter_burden: droop_stays
          no_fault: droop_gone
          reversed_diode: no_current
      check_band:
        name: Check the cathode band faces the negative side
        minutes: 1
        how: The striped end of the diode is the cathode; it goes towards the supply's negative terminal.
        outcomes:
          reversed_diode: band_wrong
          meter_burden: band_ok
          bulk_series_resistance: band_ok
          no_fault: band_ok

  grating:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: wavelength_error_pct, op: abs_lt, value: 1, p_true: 0.95, p_false: 0.01}
          - {feature: angle_zero_sigma, op: "<", value: 5, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the wavelength with its uncertainty.
      angle_zero_offset:
        name: Spectrometer angle zero misread
        prior: 0.20
        typical_size: "Orders on one side read high and on the other low by the same angle"
        conditions:
          - {feature: angle_zero_sigma, op: ">", value: 6, p_true: 0.95, p_false: 0.02}
          - {feature: wavelength_error_pct, op: abs_lt, value: 1, p_true: 0.9, p_false: 0.1}
        fix: Re-zero the vernier on the straight-through beam, or average the left and right angles for each order, and refit.
      grating_density_wrong:
        name: A grating with a different line density than assumed
        prior: 0.17
        typical_size: "A 500 lines/mm grating read as 600 lines/mm makes every wavelength 17% short"
        conditions:
          - {feature: wavelength_error_pct, op: abs_gt, value: 2, p_true: 0.95, p_false: 0.02}
          - {feature: angle_zero_sigma, op: "<", value: 5, p_true: 0.9, p_false: 0.2}
          - {feature: grating_confirmed_wrong, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Read the line density off the grating's mount, or calibrate it with a HeNe line, and refit with the right value.
      laser_not_stated_wavelength:
        name: A laser wavelength different from its label
        prior: 0.15
        conditions:
          - {feature: wavelength_error_pct, op: abs_gt, value: 2, p_true: 0.95, p_false: 0.02}
          - {feature: angle_zero_sigma, op: "<", value: 5, p_true: 0.9, p_false: 0.2}
          - {feature: grating_confirmed_wrong, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Calibrate the spectrometer with a known reference line and quote the measured laser wavelength, not the label.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat with a HeNe reference line, reading orders on both sides, and compare the angles.
    tests:
      reference_line_check:
        name: Repeat with a source of known wavelength (HeNe 632.8 nm)
        minutes: 4
        how: Swap in a helium-neon laser or a sodium lamp and measure orders −3 to +3 with the same grating.
        outcomes:
          grating_density_wrong: reference_off
          laser_not_stated_wavelength: reference_ok
          angle_zero_offset: reference_ok
          no_fault: reference_ok
        safety: Laser changes need your laser safety officer's procedure; never view the beam directly.
      rezero_vernier:
        name: Re-zero the spectrometer on the straight-through beam
        minutes: 2
        how: Set the telescope on the zeroth order and read the vernier; that is your zero.
        outcomes:
          angle_zero_offset: offset_gone
          grating_density_wrong: offset_unchanged
          laser_not_stated_wavelength: offset_unchanged
          no_fault: offset_unchanged

  hall:
    faults:
      no_fault:
        name: No fault found
        prior: 0.30
        conditions:
          - {feature: density_error_pct, op: abs_lt, value: 5, p_true: 0.95, p_false: 0.01}
          - {feature: zero_offset_sigma, op: "<", value: 4, p_true: 0.95, p_false: 0.01}
        fix: Nothing to fix. Record the carrier density with its uncertainty.
      contact_misalignment:
        name: Hall contacts not exactly opposite each other
        prior: 0.20
        typical_size: "A small offset between contacts adds an IR drop proportional to current, which looks like extra Hall voltage"
        conditions:
          - {feature: density_error_pct, op: abs_gt, value: 10, p_true: 0.95, p_false: 0.03}
          - {feature: zero_offset_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: misalignment_found, op: is, value: true, p_true: 0.95, p_false: 0.05}
        fix: Average the readings taken with the field forward and reversed, which cancels the misalignment voltage, or remake the contacts exactly opposite each other.
      field_lower_than_set:
        name: Magnetic field lower than the value you set
        prior: 0.16
        conditions:
          - {feature: density_error_pct, op: ">", value: 10, p_true: 0.95, p_false: 0.02}
          - {feature: zero_offset_sigma, op: "<", value: 4, p_true: 0.9, p_false: 0.2}
          - {feature: misalignment_found, op: is, value: true, p_true: 0.05, p_false: 0.95}
        fix: Measure the field in the gap with a gaussmeter and use the measured value in the analysis.
      thermoelectric_contact_offset:
        name: Thermoelectric voltage at the contacts
        prior: 0.15
        conditions:
          - {feature: zero_offset_sigma, op: ">", value: 5, p_true: 0.95, p_false: 0.02}
          - {feature: density_error_pct, op: abs_lt, value: 5, p_true: 0.9, p_false: 0.1}
        fix: Let the contacts reach a steady temperature, then reverse the sample current and average the two readings.
      unknown_cause:
        name: Unknown cause (none of the above fits well)
        prior: 0.05
        conditions: []
        flat_likelihood: 0.01
        fix: Repeat with the current and the field each reversed, and measure the field with a gaussmeter.
    tests:
      reverse_field:
        name: Repeat with the magnetic field reversed
        minutes: 3
        how: Reverse the magnet current (or turn the sample over) and repeat the current sweep. The Hall voltage flips; a misalignment voltage does not.
        outcomes:
          contact_misalignment: asymmetric
          field_lower_than_set: symmetric
          no_fault: symmetric
          thermoelectric_contact_offset: offset_stays
      gaussmeter_check:
        name: Measure the field in the gap with a gaussmeter
        minutes: 4
        how: Put the gaussmeter probe where the sample sits, at the same magnet current.
        outcomes:
          field_lower_than_set: field_low
          contact_misalignment: field_ok
          no_fault: field_ok
          thermoelectric_contact_offset: field_ok
      reverse_current_zero:
        name: Read the Hall voltage with zero sample current, then reverse the current
        minutes: 2
        how: A voltage that stays at zero current, and does not flip with current, is thermoelectric.
        outcomes:
          thermoelectric_contact_offset: offset_at_zero_current
          contact_misalignment: no_offset
          field_lower_than_set: no_offset
          no_fault: no_offset


# Hard safety rules applied to every recommendation and to model text.
safety:
  forbidden_phrases:
    - lift the ground
    - lift the earth
    - remove the earth
    - remove the ground pin
    - cheater plug
    - bypass the interlock
    - defeat the interlock
    - remove the laser goggles
    - look into the beam
  notes:
    high_voltage: Work above 50 V AC or 120 V DC needs your lab's electrical safety procedure.
    laser: Class 3B and 4 lasers need your laser safety officer's approval for any setup change.
